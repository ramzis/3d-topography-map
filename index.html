<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <title>3D Topography Map — explore Earth's terrain in 3D</title>
  <meta name="description" content="Interactive 3D globe terrain: real elevation data, satellite imagery, live day/night sky, place search and teleport. Fly anywhere on Earth — from Vilnius to anywhere." />
  <meta name="keywords" content="3D map, topography, terrain, elevation, satellite, earth, 3D globe, relief map" />
  <meta name="author" content="tadas" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#10141a" />

  <link rel="canonical" href="https://ramzis.github.io/3d-topography-map/" />

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn, ...) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="3D Topography Map" />
  <meta property="og:title" content="3D Topography Map — explore Earth's terrain in 3D" />
  <meta property="og:description" content="Real elevation, satellite imagery, live day/night sky, place search and teleport. Fly anywhere on Earth." />
  <meta property="og:url" content="https://ramzis.github.io/3d-topography-map/" />
  <meta property="og:image" content="https://ramzis.github.io/3d-topography-map/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="3D terrain of Vilnius rendered with satellite imagery" />
  <meta property="og:locale" content="en" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="3D Topography Map — explore Earth's terrain in 3D" />
  <meta name="twitter:description" content="Real elevation, satellite imagery, live day/night sky. Fly anywhere on Earth." />
  <meta name="twitter:image" content="https://ramzis.github.io/3d-topography-map/og-image.png" />

  <!-- PWA-ish extras -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="3D Topo Map" />

  <!-- emoji favicon (no file needed) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />

  <!-- Google Font: Sora -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Average+Sans&display=swap" rel="stylesheet" />

  <!-- structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "3D Topography Map",
    "description": "Interactive 3D terrain of Earth with real elevation data, satellite imagery, a live day/night sky, place search and teleport.",
    "applicationCategory": "MapApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript and WebGL",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "isAccessibleForFree": true
  }
  </script>

  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/"
      }
    }
  </script>
</head>
<body>
  <div id="navBar">
    <div id="searchBar">
      <input type="search" id="searchInput" placeholder="Search a place…" autocomplete="off" />
      <div id="searchResults"></div>
    </div>
    <button id="diceBtn" class="icon-box labelled" aria-label="teleport to a random place" title="Random place">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/></svg>
      <span class="btn-label">Random</span>
    </button>
  </div>

  <div id="bottomCol">
    <div id="locRow">
      <div id="locationStatus">
        <svg class="loc-pin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="locationText"></span>
      </div>
      <button id="shareBtn" class="icon-box" aria-label="share this view" title="Share this view">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
    </div>

    <div id="exagBar">
      <label for="exaggeration">Exaggeration <output id="exagVal">6×</output></label>
      <input type="range" id="exaggeration" min="1" max="60" step="0.5" value="6" />
    </div>
  </div>

  <button id="sunBtn" class="icon-box labelled" aria-label="always daytime" title="Always daytime">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    <span class="btn-label">Sun</span>
  </button>

  <div id="keyHelp">
    <div class="key-groups">
      <div class="key-group">
        <div class="key-desc">move</div>
        <div class="key-row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
      </div>
      <div class="key-group">
        <div class="key-desc">up / down</div>
        <div class="key-row"><kbd>Space</kbd><kbd>C</kbd></div>
      </div>
      <div class="key-group">
        <div class="key-desc">sprint</div>
        <div class="key-row"><kbd>Shift</kbd></div>
      </div>
      <div class="key-group">
        <div class="key-desc">speed</div>
        <div class="key-row"><kbd>Scroll</kbd></div>
      </div>
      <div class="key-group">
        <div class="key-desc">release mouse</div>
        <div class="key-row"><kbd>Esc</kbd></div>
      </div>
    </div>
  </div>

  <footer id="attrib">
    Elevation: Mapzen/Tilezen terrain (SRTM et al.), AWS Open Data ·
    Imagery: Esri, Maxar, Earthstar Geographics ·
    Boundaries: © Vilniaus miesto savivaldybė / ID Vilnius
  </footer>

  <script>
    // key help is desktop-only
    if (matchMedia('(pointer: coarse)').matches) {
      document.getElementById('keyHelp').style.display = 'none';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
